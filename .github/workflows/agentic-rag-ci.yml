name: Agentic RAG CI

on:
  push:
    branches:
      - feature/agentic-rag-2026-10-05
  pull_request:
    paths:
      - "backend/rag.py"
      - "backend/rag_evaluation.py"
      - "backend/tests/test_rag.py"
      - "backend/data_api*.py"
      - "backend/migrations/smarthub_core/**"
      - "frontend/src/pages/RimDocsAgentic.jsx"
      - "frontend/src/pages/RAGEvaluation.jsx"
      - "frontend/src/App.jsx"
      - "frontend/src/config/tools.js"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile rag.py rag_evaluation.py
      - run: pytest -q tests/test_rag.py tests/test_data_api_retrieval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx eslint src/pages/RimDocsAgentic.jsx src/pages/RAGEvaluation.jsx src/App.jsx src/config/tools.js
      - run: npm run build
